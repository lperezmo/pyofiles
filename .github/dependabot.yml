version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only: a limit of 0 turns off routine version-update PRs.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only: a limit of 0 turns off routine version-update PRs.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
