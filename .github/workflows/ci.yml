name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust unit tests
        run: cargo test --lib
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Install and test
        run: |
          pip install dist/*.whl
          python -c "import pyofiles; print('walk:', len(pyofiles.walk('.'))); print('find:', len(pyofiles.find('.', extensions=['.rs']))); print('glob:', len(pyofiles.glob('.', '**/*.toml'))); print('list_dir:', len(pyofiles.list_dir('.'))); print('index:', len(pyofiles.index('.', ['.rs', '.toml']))); usage = pyofiles.disk_usage('.'); print(f'disk_usage: {usage.total_files} files, {usage.total_size_mb:.2f} MB'); print('All OK')"
        shell: bash
      # Keep Python 3.9 wheel/import/CLI coverage without vulnerable pytest 8.
      - name: Python unit tests
        if: matrix.python-version != '3.9'
        run: |
          python -m pip install "pytest>=9.0.3"
          python -m pytest tests/ -v
      - name: CLI integration tests
        run: |
          pyofiles --version
          python -m pyofiles --version
          pyofiles walk python --ext .py -l
          pyofiles find . --ext .toml --limit 1
          pyofiles glob . "**/*.rs"
          pyofiles ls . --skip-hidden
          pyofiles index python --ext .py
          pyofiles du . --top 3 --threads 2
          pyofiles find . --ext .rs --json
        shell: bash
      # GitHub windows runners are elevated, so the real MFT path can be
      # exercised against the NTFS system volume. The workspace itself may
      # live on a ReFS Dev Drive, hence the fixed C:\ target directory.
      - name: MFT fast path integration test (Windows, elevated)
        if: runner.os == 'Windows'
        run: |
          python - <<'EOF'
          import pyofiles

          target = 'C:\\Windows\\System32\\drivers'
          usage = pyofiles.disk_usage(target, mft=True)
          assert usage.total_files > 0, usage

          found = pyofiles.find(target, extensions=['.sys'], mft=True, limit=5)
          assert 0 < len(found) <= 5, len(found)
          assert all(f.name.lower().endswith('.sys') for f in found), found
          assert all(f.size >= 0 and f.modified for f in found), found

          # Loose agreement with the walk backend on a stable directory.
          walk_usage = pyofiles.disk_usage(target)
          lo, hi = sorted([usage.total_files, walk_usage.total_files])
          assert hi <= lo * 1.10, (usage.total_files, walk_usage.total_files)
          print(f'MFT OK: mft={usage.total_files} walk={walk_usage.total_files} '
                f'files, {usage.total_size_mb:.1f} MB')
          EOF
          pyofiles du 'C:\Windows\System32\drivers' --mft --top 3
        shell: bash
      - name: MFT unavailable off Windows
        if: runner.os == 'Linux'
        run: |
          python - <<'EOF'
          import pyofiles
          try:
              pyofiles.disk_usage('.', mft=True)
          except ValueError as e:
              assert 'only available on Windows' in str(e), e
              print('non-Windows mft=True ValueError OK')
          else:
              raise AssertionError('expected ValueError from mft=True')
          EOF
        shell: bash

