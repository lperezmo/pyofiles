[package]
name = "pyofiles"
version = "0.7.4"
edition = "2021"

[lib]
name = "pyofiles"
crate-type = ["cdylib"]

[features]
# Opt-in so plain `cargo test` links libpython and Rust unit tests work on
# every platform; maturin builds enable it via pyproject.toml.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
globset = "0.4"
ignore = "0.4"
dashmap = "6.1"

[target.'cfg(windows)'.dependencies]
ntfs = "0.4"


[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
