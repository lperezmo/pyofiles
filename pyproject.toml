[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyofiles"
version = "0.7.3"
description = "Fast, Rust-powered file operations for Python"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
keywords = ["files", "filesystem", "rust", "fast", "parallel", "walk", "find", "glob", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]

[project.scripts]
pyofiles = "pyofiles.cli:main"



[tool.maturin]
features = ["extension-module"]
python-source = "python"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
    "Cargo.toml:package.version",
]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"



[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "pytest>=9.0.3",
]


# pytest 9 contains the security fix and requires Python 3.10+.
# The built extension continues to support Python 3.9.
[tool.uv.dependency-groups]
dev = { requires-python = ">=3.10" }
